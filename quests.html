<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://pgwqcwpdukhwilxlgnqg.supabase.co; style-src 'self'; img-src 'self' data:; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <title>問題一覧</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
</head>
<body data-page="quests">
  <div class="page-heading">
    <h2>問題一覧</h2>
  </div>
  <div class="filter-bar">
    <input id="filter-keyword" class="filter-input" type="search" placeholder="問題タイトル・説明で検索…">
    <select id="filter-difficulty" class="filter-select" aria-label="難易度絞り込み">
      <option value="">難易度: すべて</option>
      <option value="1">1: 初級 (+50pt/問)</option>
      <option value="2">2: 中級 (+100pt/問)</option>
      <option value="3">3: 上級 (+150pt/問)</option>
      <option value="4">4: 難関 (+200pt/問)</option>
      <option value="5">5: 最難関 (+250pt/問)</option>
    </select>
  </div>
  <div id="quest-grid" class="card-grid"></div>
  <p id="grid-status" class="grid-status"></p>

  <script src="js/layout.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/util.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/quests.js"></script>
</body>
</html>
