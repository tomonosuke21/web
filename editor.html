<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://pgwqcwpdukhwilxlgnqg.supabase.co; style-src 'self'; img-src 'self' data:; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <title>問題を作る</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
</head>
<body data-page="editor">
  <main class="container">
    <div class="page-heading">
      <h2>問題を作る</h2>
    </div>

    <p id="editor-notice" class="text-center">読み込み中…</p>

    <div id="editor-main" class="center-card" hidden>
      <h2>新しい問題を作る</h2>
      <div>
        <label>タイトル <input id="q-title" type="text" maxlength="100"></label>
        <label>説明 <input id="q-description" type="text" maxlength="500" size="50"></label>
        <div class="flex-row">
          <label>言語
            <select id="q-language">
              <option value="python">Python</option>
            </select>
          </label>
          <label>難易度
            <select id="q-difficulty">
              <option value="1">初級</option>
              <option value="2">中級</option>
              <option value="3">上級</option>
              <option value="4">難関</option>
              <option value="5">最難関</option>
            </select>
          </label>
          <label>所要時間(分) <input id="q-minutes" type="number" min="1" max="30" value="5"></label>
        </div>
        <div class="mt">
          <button id="q-create">作成する(下書き)</button>
          <span id="q-message"></span>
        </div>
      </div>

      <hr>
      <h2>作成問題</h2>
      <div id="my-quests"></div>

      <div id="stage-editor" hidden>
        <hr>
        <h2 id="stage-editor-title"></h2>
        <ol id="stage-editor-list"></ol>

        <h3>ステージを追加</h3>
        <div class="flex-row">
          <label>種類
            <select id="s-kind">
              <option value="study">スタディ</option>
              <option value="fill">穴埋めテスト</option>
              <option value="problem">練習問題</option>
            </select>
          </label>
          <label>タイトル <input id="s-title" type="text" maxlength="100"></label>
        </div>
        <div id="s-fields"></div>
        <div class="mt">
          <button id="s-add" class="success">ステージを追加する</button>
          <span id="s-message"></span>
        </div>
      </div>
    </div>

    <div id="admin-main" class="center-card" hidden>
      <h2>承認待ちの問題(管理者)</h2>
      <div id="pending-quests"></div>
    </div>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/util.js"></script>
  <script src="js/runner.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
