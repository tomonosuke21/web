<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://pgwqcwpdukhwilxlgnqg.supabase.co; style-src 'self'; img-src 'self' data:; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <title>ステージ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <h1 class="site-title">Python学習 - ステージ</h1>
      <nav class="site-nav">
        <a href="quests.html">クエスト一覧へ戻る</a>
        <a href="index.html">練習問題</a>
        <a href="editor.html">問題を作る</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="auth-bar">
      <div class="auth-controls">
        <button id="login">GitHubでログイン</button>
        <button id="logout" class="secondary" hidden>ログアウト</button>
        <span id="user"></span>
      </div>
    </div>

    <div id="profile-edit" hidden>
      <label for="nickname-input">ニックネーム(本名は使わないでください):</label>
      <input id="nickname-input" type="text" maxlength="20">
      <button id="nickname-save">保存</button>
      <span id="nickname-message"></span>
    </div>

    <div class="center-card" style="margin-bottom: 16px;">
      <h2 id="stage-title" style="margin: 0;">読み込み中…</h2>
    </div>

    <div id="stage-body"></div>
    <p id="stage-message"></p>
    <p id="stage-next"></p>
  </main>

  <!-- 全画面 ステージクリア表示 -->
  <div id="stage-clear-overlay" class="stage-clear-overlay" role="dialog" aria-modal="true" hidden>
    <div class="stage-clear-box">
      <div class="stage-clear-badge">🎉</div>
      <h2 class="stage-clear-title">ステージクリア！</h2>
      <p id="stage-clear-sub" class="stage-clear-sub"></p>
      <div class="stage-clear-actions">
        <a id="stage-clear-next-btn" class="stage-clear-btn stage-clear-btn-primary" href="quests.html" hidden>次のステージへ →</a>
        <a id="stage-clear-quests-btn" class="stage-clear-btn stage-clear-btn-quests" href="quests.html">クエスト一覧に戻る</a>
        <button id="stage-clear-close-btn" type="button" class="stage-clear-btn stage-clear-btn-close">閉じる</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/util.js"></script>
  <script src="js/runner.js"></script>
  <script src="js/stage.js"></script>
</body>
</html>
