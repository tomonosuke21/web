<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://pgwqcwpdukhwilxlgnqg.supabase.co; style-src 'self'; img-src 'self' data:; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <title>ステージ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>

<body data-page="stage">
  <div class="back-bar">
    <a id="back-link" class="back-button" href="quests.html">戻る</a>
  </div>

  <div class="center-card stage-title-card">
    <h2 id="stage-title">読み込み中…</h2>
  </div>

  <div id="stage-body"></div>
  <p id="stage-message"></p>
  <p id="stage-next"></p>


  <!-- 全画面 ステージクリア表示 -->
  <div id="stage-clear-overlay" class="stage-clear-overlay" role="dialog" aria-modal="true" hidden>
    <div class="stage-clear-box">
      <h2 class="stage-clear-title">ステージクリア！</h2>
      <p id="stage-clear-sub" class="stage-clear-sub"></p>
      <div class="stage-clear-actions">
        <a id="stage-clear-next-btn" class="stage-clear-btn stage-clear-btn-primary" href="quests.html" hidden>次のステージへ</a>
        <a id="stage-clear-quests-btn" class="stage-clear-btn stage-clear-btn-quests" href="quests.html">問題一覧に戻る</a>
        <button id="stage-clear-close-btn" type="button" class="stage-clear-btn stage-clear-btn-close">閉じる</button>
      </div>
    </div>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/util.js"></script>
