name: backup-supabase

on:
  schedule:
    - cron: "0 18 * * 0"   # 毎週日曜 18:00(UTC)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: PostgreSQLのクライアントを入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: ダンプして暗号化する
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          pg_dump "$DB_URL" --no-owner --no-privileges --schema=public \
            | gzip \
            | gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
                  --symmetric --cipher-algo AES256 -o backup.sql.gz.gpg

      - name: 暗号化したバックアップを保存する
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: backup.sql.gz.gpg
          retention-days: 30