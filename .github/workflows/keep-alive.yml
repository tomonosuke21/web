name: keep-supabase-alive

on:
  schedule:
    - cron: "0 3 */3 * *"   # 3日おきの午前3時(UTC)
  workflow_dispatch:         # 手動でも実行できる

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabaseにアクセスする
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Secretが空です。名前と値を確認してください。"
            exit 1
          fi
          URL=$(echo "$SUPABASE_URL" | tr -d '[:space:]"' | sed 's:/*$::')
          KEY=$(echo "$SUPABASE_KEY" | tr -d '[:space:]"')
          curl -sS --fail "$URL/rest/v1/results?select=id&limit=1" -H "apikey: $KEY"