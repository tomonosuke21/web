name: keep-supabase-alive

on:
  schedule:
    - cron: "0 3 */3 * *"   # 3日おきの午前3時(UTC)
  workflow_dispatch:         # 手動でも実行できる

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabaseにアクセスする
        run: |
          curl -sS --fail "${{ secrets.SUPABASE_URL }}/rest/v1/results?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}"