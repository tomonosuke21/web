name: keep-supabase-alive

on:
  schedule:
    - cron: "0 3 */3 * *"   # 3日おきの午前3時(UTC)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabaseにアクセスする
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          KEY=$(echo "$SUPABASE_KEY" | tr -d '[:space:]"')
          curl -sS --fail "https://pgwqcwpdukhwilxlgnqg.supabase.co/rest/v1/results?select=id&limit=1" -H "apikey: $KEY"