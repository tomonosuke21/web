<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://pgwqcwpdukhwilxlgnqg.supabase.co; style-src 'self'; img-src 'self' data:; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Pythonを動かそう</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
  <link rel="icon" href="data:,">
</head>
<body>
  <h1>Python学習</h1>

  <div>
    <button id="login">GitHubでログイン</button>
    <button id="logout" hidden>ログアウト</button>
    <span id="user"></span>
  </div>

  <div id="profile-edit" hidden>
    <label for="nickname-input">ニックネーム(本名は使わないでください):</label>
    <input id="nickname-input" type="text" maxlength="20">
    <button id="nickname-save">保存</button>
    <span id="nickname-message"></span>
  </div>

  <select id="problem-select"></select>
  <h2 id="problem-title"></h2>
  <p id="problem-statement"></p>

  <textarea id="code" rows="8" cols="50">print("hello")</textarea>
  <br>
  <button id="run" disabled>実行</button>
  <button id="grade" disabled>採点</button>
  <p id="status">Pythonを準備中…</p>
  <p id="result"></p>

  <pre id="output"></pre>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
